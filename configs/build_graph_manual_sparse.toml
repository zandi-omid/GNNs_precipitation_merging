[paths]
dem_path = "./data/DEM/ASTER_DEM_0p1deg_AZ_buffer.tif"
graph_path = "./data/graphs/gsi_a1_r100_a2_knn8_manual_sparse.pkl"
era5_path = "./data/ERA5_daily/ERA5_DAILY_2005_2024_MERGED.nc"
imerg_path = "./data/IMERG_daily/IMERG_DAILY_2005_2024_MERGED.nc"
gauge_path = "./data/ghcn_data/ghcn_precip_2005_2024_AZ_buffer_50pct.csv"
seq_out_root = "./GSI/data"
gauge_csv_out_dir = "./data/gauge_splits_tgsi"

[split]
mode = "manual"   # random | manual
train_density = 0.75
seed = 42
manual_split_csv = "./data/ghcn_data/manually_selected_train_test_gauges/train_gauges_sparse.csv"
manual_train_rule = "xy_nonzero"
manual_name = "manual_xy_nonzero"

[features]
include_aux = true

[training_mode]
mode = "global"   # global | per_day

[adaptive_adj]
enabled = false
mode = "edge"
nheads = 4

[domain]
xmin = -115.25
ymin = 29.85
xmax = -106.45
ymax = 38.25

[sequence]
t_in = 30
date_start = "2005-01-01"
date_end = "2024-12-31"

[graph]
a1_radius_km = 100.0
a1_fallback_k = 2
a1_power = 2.0
a2_mode = "knn"
a2_k = 8
a2_power = 2.0
# only used if a2_mode = "radius"
a2_radius_km = 50.0
max_neighbors = 30
use_max_neighbors = true
