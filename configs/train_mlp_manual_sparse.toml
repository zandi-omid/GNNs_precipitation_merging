[meta]
run_name = "STACKCV_manualSparse_final_MLP_A1GaugeK10_Q32_train2005_2019"

[data]
csv_path = "./ANN/df_CSV_files/df_gsi_a1a2_kgauge10_idw_loo.csv"
feature_cols = [
    "ERA5",
    "IMERG",
    "gauge_01_value",
    "gauge_01_distance_km",
    "gauge_02_value",
    "gauge_02_distance_km",
    "gauge_03_value",
    "gauge_03_distance_km",
    "gauge_04_value",
    "gauge_04_distance_km",
    "gauge_05_value",
    "gauge_05_distance_km",
    "gauge_06_value",
    "gauge_06_distance_km",
    "gauge_07_value",
    "gauge_07_distance_km",
    "gauge_08_value",
    "gauge_08_distance_km",
    "gauge_09_value",
    "gauge_09_distance_km",
    "gauge_10_value",
    "gauge_10_distance_km",
]
batch_size = 8192
num_workers = 4
train_years = [2005, 2019]
val_years = [2019, 2019]
test_years = [2020, 2024]

[model]
hidden_dims = [256, 256, 128, 64]
dropout = 0.1

[loss]
name = "quantile"
n_quantiles = 32
higher_q_weight = 1.0
crossing_weight = 0.0

[optim]
lr = 1e-3
weight_decay = 1e-4

[scheduler]
name = "CosineAnnealingLR"
t_max = 200
eta_min = 0.0

[trainer]
max_epochs = 200
precision = "16-mixed"
log_every_n_steps = 20
devices = 1
accelerator = "gpu"
strategy = "auto"
early_stopping = false
