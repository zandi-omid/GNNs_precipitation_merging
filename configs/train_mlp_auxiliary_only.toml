[meta]
run_name = "AUXONLY_manualSparse_MLP_ERA5_IMERG_Q32_train2005_2018_val2019"

[data]
csv_path = "./ANN/df_CSV_files/df_gsi_a1a2_kgauge10_idw_loo.csv"
feature_cols = ["ERA5", "IMERG"]
batch_size = 8192
num_workers = 4
train_years = [2005, 2018]
val_years = [2019, 2019]
test_years = [2020, 2024]

[model]
hidden_dims = [256, 256, 128, 64]
dropout = 0.10

[loss]
name = "quantile"
n_quantiles = 32
higher_q_weight = 1.0
crossing_weight = 0.0

[optim]
lr = 1e-3
weight_decay = 1e-4

[scheduler]
name = "CosineAnnealingLR"
t_max = 200
eta_min = 0.0

[trainer]
max_epochs = 200
precision = "32-true"
log_every_n_steps = 20
devices = 1
accelerator = "cpu"
strategy = "auto"
early_stopping = false
